<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo Dalami Peluang! — ADALUANG</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#8056d9;--dark:#35256c;--muted:#8984a5}
body{
 min-height:100vh;font-family:Nunito,sans-serif;color:var(--dark);
 overflow-x:hidden;
 background:radial-gradient(ellipse at 3% 28%,#f0e4ff 0%,transparent 34%),
 radial-gradient(ellipse at 99% 78%,#fff0f8 0%,transparent 32%),#fcfaff
}
button,input,textarea{font:inherit}
.page{min-height:100vh;display:grid;grid-template-columns:1.04fr 1.12fr .91fr;align-items:center;gap:30px;padding:55px 7.8%}
.pill{display:inline-block;padding:10px 17px;border-radius:30px;background:#f0e7ff;color:#8a66cf;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:32px}
h1{font-size:clamp(43px,3.8vw,62px);line-height:1.06;letter-spacing:-1.5px;font-weight:900;color:#35256c}
h1 span{display:block;color:#8056d9}
.description{color:#8984a5;font-size:16px;font-weight:700;line-height:1.9;margin-top:23px;max-width:410px}
.math{margin-top:61px;font-size:19px;font-style:italic;color:#9879d1}
.left-art{width:100%;max-width:390px;margin-top:12px;display:block}
.center{width:100%;max-width:460px;justify-self:center;background:#ffffffef;border:1px solid #f1ecf8;border-radius:29px;padding:28px 29px 40px;box-shadow:0 22px 65px #664c9917;text-align:center}
.center h2{font-size:28px;font-weight:900;line-height:1.4}
.sub{color:#8984a5;font-size:16px;font-weight:700;margin:2px 0 21px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room{border:1px solid transparent;border-radius:21px;min-width:0;padding:17px 13px 15px;text-align:left;cursor:pointer;color:#352d55;transition:.2s}
.room:hover{transform:translateY(-4px);box-shadow:0 10px 22px #60468b15}
.teacher{background:linear-gradient(145deg,#f8f2ff,#eee7ff);border-color:#eae0fb}
.student{background:linear-gradient(145deg,#eff8ff,#e0f1ff);border-color:#deedfb}
.avatar{width:67px;height:67px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#e1d0ff;font-size:34px}
.student .avatar{background:#cce9ff}
.room h3{font-size:16px;font-weight:900;white-space:nowrap}
.room p{font-size:11px;line-height:1.5;color:#8984a5;min-height:34px;margin-top:4px}
.arrow{margin-top:7px;height:31px;width:31px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:white;background:#b89be9;font-size:21px}
.student .arrow{background:#79b8e9}
.register{margin-top:28px;color:#8984a5;font-size:12px}
.register button{background:none;border:0;color:#8056d9;cursor:pointer;font-weight:900;margin-left:5px}
.right{text-align:center}
.quote{font-size:15px;font-style:italic;line-height:1.8;color:#8984a5;margin-bottom:48px}
.formula{font-size:19px;font-style:italic;color:#a087d6;text-align:left}
.right-art{width:100%;max-width:370px;margin:auto;display:block}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#2b1d4988;backdrop-filter:blur(5px);justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal-card{width:100%;max-width:430px;background:white;border-radius:25px;padding:30px;max-height:92vh;overflow:auto}
.modal-card h2{font-size:26px;margin-bottom:6px}
.modal-card>p{font-size:14px;color:var(--muted);margin-bottom:22px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:13px;border:1px solid #e6def4;border-radius:12px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--purple)}
.submit,.secondary,.danger,.small-btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.submit{width:100%;background:var(--purple);color:white}
.secondary,.small-btn{background:#f0e7ff;color:#6e49bd}
.danger{background:#fff0f2;color:#b3425a}
.cancel{width:100%;background:none;border:0;padding:12px;color:var(--muted);cursor:pointer}
.message{font-size:13px;color:#b3425a;margin-top:12px;line-height:1.5}
.ok{color:#23866b!important}
.hidden{display:none!important}
.app{display:none;min-height:100vh;padding:24px;background:#fcfaff}
.app.show{display:block}
.app-top,.content{max-width:1100px;margin:auto}
.app-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:24px;font-weight:900}
.brand span{color:var(--purple)}
.panel{background:white;border:1px solid #f1ecf8;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 15px 45px #664c9910}
.panel h2{font-size:25px;margin-bottom:7px}
.muted{color:var(--muted);font-size:14px;line-height:1.6}
.stats,.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat,.item{padding:16px;border:1px solid #eee6fa;border-radius:16px;overflow-wrap:anywhere}
.stat{background:#f7f1ff}
.stat strong{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.item h3{margin-bottom:8px}
.item p{margin:7px 0}
.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{background:#f4effc;color:#6e49bd;border:0;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}
.code{display:inline-block;font-weight:900;letter-spacing:2px;color:#6845ae;background:#f0e7ff;padding:8px 12px;border-radius:10px;margin:6px 0}
.tag{display:inline-block;font-size:11px;font-weight:900;border-radius:20px;padding:5px 9px;background:#f0e7ff;color:#6e49bd}
.pending{background:#fff3d7;color:#946b08}
.approved{background:#e2f8ee;color:#23866b}
.rejected{background:#fff0f2;color:#b3425a}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.inline .full{grid-column:1/-1}
.empty{padding:22px;border:1px dashed #d9c9f2;border-radius:16px;color:var(--muted);font-size:14px;text-align:center}

/* CSS materi peluang dibuat terpisah agar tidak bentrok dengan ADALUANG */
.peluang-module{color:#35256c;font-family:Nunito,sans-serif}
.peluang-module *{box-sizing:border-box}
.peluang-module .pm-hero{background:linear-gradient(120deg,#f1eaff,#eaf6ff);border-radius:20px;padding:22px;margin:12px 0 18px}
.peluang-module h2,.peluang-module h3{color:#35256c}
.peluang-module .pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.peluang-module .pm-card{background:#fff;border:1px solid #eee6fa;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 8px 24px #664c990b}
.peluang-module .pm-card p{line-height:1.65;margin:8px 0;color:#655d7f}
.peluang-module button{border:0;border-radius:10px;background:#8056d9;color:white;padding:10px 14px;font-weight:800;cursor:pointer;margin:4px}
.peluang-module button.pm-light{background:#f0e7ff;color:#6e49bd}
.peluang-module input,.peluang-module select{padding:10px;border:1px solid #ddd2f1;border-radius:9px;max-width:100%;margin:5px}
.peluang-module .pm-result{background:#f6f1ff;border-radius:12px;padding:12px;margin-top:10px;min-height:42px}
.peluang-module .pm-table{width:100%;border-collapse:collapse;margin:10px 0}
.peluang-module .pm-table th,.peluang-module .pm-table td{border:1px solid #e7def4;padding:8px;text-align:center}
.peluang-module .pm-die{font-size:40px;display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;background:white;border:2px solid #8b69d0;border-radius:15px;margin:6px;box-shadow:0 5px 0 #d9c8f2}
.peluang-module .pm-coins{font-size:30px;letter-spacing:5px}
.peluang-module .pm-history{max-height:150px;overflow:auto;font-size:13px}
.peluang-module .pm-small{font-size:12px;color:#8984a5}
.peluang-module .pm-mission{background:#f7f3ff;border-radius:14px;padding:14px}
.peluang-module .pm-options{display:flex;flex-wrap:wrap;gap:8px}
.peluang-module .pm-options button{background:#f0e7ff;color:#6e49bd}
.peluang-module .pm-options button.active{background:#8056d9;color:white}

@media(max-width:1100px){
 .page{grid-template-columns:1fr 1.05fr;padding:45px 6%}
 .right{display:none}
}
@media(max-width:650px){
 .page{display:flex;flex-direction:column;gap:28px;padding:35px 20px}
 .left{text-align:center;width:100%}
 h1{font-size:45px}
 .description{font-size:14px;margin:17px auto 0}
 .pill{margin-bottom:23px}
 .math,.left-art{display:none}
 .center{padding:27px 17px 32px}
 .center h2{font-size:25px}
 .room{padding:15px 9px}
 .room h3{font-size:14px}
 .room p{font-size:10px}
 .inline,.items,.stats{grid-template-columns:1fr}
 .app{padding:14px}
 .panel{padding:18px}
 .peluang-module .pm-grid{grid-template-columns:1fr}
 .peluang-module .pm-card{padding:13px}
}
</style>
</head>

<body>
<div id="landing">
<main class="page">
<section class="left">
 <div class="pill">✦ RUANG BELAJAR DIGITAL</div>
 <h1>Ayo Dalami <span>Peluang!</span></h1>
 <p class="description">Belajar matematika jadi lebih seru, interaktif, dan dekat dengan kehidupan sehari-hari.</p>
 <div class="math">P(A) = ?</div>
 <svg class="left-art" viewBox="0 0 390 250">
  <ellipse cx="190" cy="220" rx="172" ry="24" fill="#e8dcff"/>
  <ellipse cx="200" cy="194" rx="126" ry="75" fill="#eee5ff"/>
  <path d="M104 102Q102 42 150 37Q201 37 203 99L207 135L107 139Z" fill="#52318e"/>
  <ellipse cx="153" cy="102" rx="36" ry="43" fill="#ffd9b9"/>
  <path d="M117 94Q119 55 153 55Q187 57 189 92L178 75Q148 85 122 72Z" fill="#52318e"/>
  <circle cx="140" cy="102" r="3" fill="#35256c"/>
  <circle cx="166" cy="102" r="3" fill="#35256c"/>
  <path d="M122 143Q153 128 182 144L205 194L101 194Z" fill="#a27ae9"/>
  <rect x="139" y="177" width="111" height="53" rx="7" fill="#6845ae"/>
  <rect x="145" y="182" width="99" height="42" rx="4" fill="#dff3ff"/>

 </svg>

<section class="center">
 <h2>Selamat datang!</h2>
 <p class="sub">Pilih ruang belajarmu.</p>
 <div class="rooms">
  <button class="room teacher" onclick="openTeacher()">
   <div class="avatar">👩🏻‍🏫</div><h3>Ruang Guru</h3>
   <p>Kelola kelas dengan kode kelas</p><div class="arrow">➜</div>
  </button>
  <button class="room student" onclick="openStudent()">
   <div class="avatar">🧑🏻‍🎓</div><h3>Ruang Murid</h3>
   <p>Masuk dengan nama dan kode kelas</p><div class="arrow">➜</div>
  </button>
 </div>
 <div class="register">Guru belum punya akun?<button onclick="openRegister()">Daftar sekarang</button></div>
</section>

<section class="right">
 <p class="quote">Peluang hari ini,<br>kesempatan masa depan ♡</p>
 <div class="formula">P(A)</div>
 <svg class="right-art" viewBox="0 0 370 320">
  <ellipse cx="185" cy="287" rx="162" ry="23" fill="#e9dcff"/>
  <path d="M78 234L278 218L322 238L123 258Z" fill="#7b4dbd"/>
  <path d="M78 234L123 258L123 280L78 255Z" fill="#a47ae1"/>
  <path d="M123 258L322 238L322 258L123 280Z" fill="#8c5bd0"/>
 </svg>
</section>
</main>
</div>

<div class="modal" id="modal">
 <div class="modal-card">
  <h2 id="modalTitle"></h2>
  <p id="modalSubtitle"></p>
  <form id="form">
   <div class="field" id="nameBox"><label>Nama</label><input id="name"></div>
   <div class="field" id="emailBox"><label>Email</label><input id="email" type="email"></div>
   <div class="field" id="passBox"><label>Kata sandi</label><input id="password" type="password"></div>
   <div class="field" id="codeBox"><label>Kode kelas</label><input id="code"></div>
   <button class="submit" id="submit">Masuk</button>
   <p id="message" class="message"></p>
   <button type="button" class="cancel" onclick="closeModal()">Batal</button>
  </form>
 </div>
</div>

<div class="app" id="app">
 <div class="app-top">
  <div class="brand">ADA<span>LUANG</span></div>
  <div>
   <span id="userLine"></span>
   <button class="danger" onclick="logout()">Keluar</button>
  </div>
 </div>
 <div class="content" id="content"></div>
</div>

  <script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const ADMIN_EMAIL='umumbgt5@gmail.com';
const firebaseConfig={
 apiKey:'AIzaSyDuVGHdk05SzOdTGuXsqfKZZwF1dYsmQDU',
 authDomain:'adaluang.firebaseapp.com',
 projectId:'adaluang',
 storageBucket:'adaluang.firebasestorage.app',
 messagingSenderId:'970393246155',
 appId:'1:970393246155:web:e2f6971c49d85624acbe4',
 measurementId:'G-PNKBBCZLMN'
};
const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);
const $=id=>document.getElementById(id);
let mode='login',profile=null,student=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function say(t,ok=false){
 $('message').textContent=t;
 $('message').classList.toggle('ok',ok);
}
function openModal(title,subtitle,button,fields){
 $('modalTitle').textContent=title;
 $('modalSubtitle').textContent=subtitle;
 $('submit').textContent=button;
 $('form').reset();say('');
 for(const [k,id] of Object.entries({
  name:'nameBox',email:'emailBox',password:'passBox',code:'codeBox'
 })){
  $(id).classList.toggle('hidden',!fields.includes(k));
  $(k).required=fields.includes(k);
 }
 $('modal').classList.add('show');
}
window.closeModal=()=>$('modal').classList.remove('show');
window.openTeacher=()=>{
 mode='login';
 openModal('Masuk Ruang Guru','Admin masuk menggunakan email admin. Guru harus memiliki akun yang disetujui admin.','Masuk',['email','password']);
};
window.openRegister=()=>{
 mode='register';
 openModal('Daftar Akun Guru','Akun guru harus disetujui admin sebelum membuat kelas.','Daftar',['name','email','password']);
};
window.openStudent=()=>{
 mode='student';
 openModal('Masuk Ruang Murid','Masukkan nama dan kode kelas dari guru.','Mulai Belajar',['name','code']);
};
$('modal').addEventListener('click',e=>{
 if(e.target===$('modal'))closeModal();
});

function errText(e){
 return({
  'auth/invalid-credential':'Email atau kata sandi salah.',
  'auth/email-already-in-use':'Email sudah terdaftar.',
  'auth/weak-password':'Kata sandi minimal 6 karakter.'
 }[e.code]||e.message||'Terjadi kesalahan.');
}
async function getProfile(u){
 const s=await getDoc(doc(db,'users',u.uid));
 return s.exists()?s.data():null;
}
$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 $('submit').disabled=true;
 try{
  if(mode==='register'){
   const c=await createUserWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('password').value);
   await setDoc(doc(db,'users',c.user.uid),{
    nama:$('name').value.trim(),
    email:$('email').value.trim().toLowerCase(),
    role:'guru',status:'pending',createdAt:serverTimestamp()
   });
   say('Pendaftaran berhasil. Tunggu persetujuan admin.',true);
   await signOut(auth);
  }else if(mode==='student'){
   const kode=$('code').value.trim().toUpperCase();
   const s=await getDocs(query(collection(db,'classes'),where('kode','==',kode)));
   if(s.empty){say('Kode kelas tidak ditemukan.');return;}
   const d=s.docs[0];
   student={
    nama:$('name').value.trim(),
    id:d.id,kode,data:d.data()
   };
   closeModal();showStudentDashboard();
  }else{
   await signInWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('password').value);
   closeModal();
  }
 }catch(e){say(errText(e))}
 finally{$('submit').disabled=false}
});

onAuthStateChanged(auth,async u=>{
 if(!u){profile=null;return}
 try{
  let p=await getProfile(u);
  if(!p){await signOut(auth);alert('Profil akun tidak ditemukan.');return}
  if(u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()&&p.role!=='admin'){
   await updateDoc(doc(db,'users',u.uid),{role:'admin',status:'approved'});
   p.role='admin';p.status='approved';
  }
  if(p.role==='guru'&&p.status!=='approved'){
   await signOut(auth);
   alert(p.status==='rejected'?'Akun guru ditolak admin.':'Akun guru masih menunggu persetujuan admin.');
   return;
  }
  if(!['admin','guru'].includes(p.role)){
   await signOut(auth);alert('Peran akun tidak valid.');return;
  }
  profile={...p,uid:u.uid,email:u.email};
  student=null;showDashboard();
 }catch(e){alert(errText(e));await signOut(auth)}
});

function showShell(label){
 $('landing').style.display='none';
 $('app').classList.add('show');
 $('userLine').textContent=label;
}
function showDashboard(){
 showShell((profile.nama||profile.email)+' · '+(profile.role==='admin'?'Admin':'Guru'));
 profile.role==='admin'?adminDashboard():teacherDashboard();
}
window.logout=async()=>{
 if(auth.currentUser)await signOut(auth);
 profile=null;student=null;
 $('app').classList.remove('show');
 $('landing').style.display='block';
};
function item(title,body){
 return `<article class="item"><h3>${esc(title||'Kelas')}</h3>${body}</article>`;
}

async function adminDashboard(){
 $('content').innerHTML=`
 <section class="panel">
  <h2>Dashboard Admin</h2>
  <p class="muted">Kelola pendaftaran guru, pantau status akun, dan atur materi pembelajaran ADALUANG.</p>
  <div id="adminStats" class="stats"><div class="empty">Memuat statistik...</div></div>
  <div class="tabs">
   <button onclick="adminTab('guru')">Manajemen Guru</button>
   <button onclick="adminTab('materi')">Manajemen Materi</button>
   <button onclick="adminTab('kelas')">Manajemen Kelas</button>
  </div>
  <div id="adminSection"></div>
 </section>`;
 try{
  const us=await getDocs(collection(db,'users'));
  const cs=await getDocs(collection(db,'classes'));
  const teachers=us.docs.map(d=>d.data()).filter(x=>x.role==='guru');
  const total=teachers.length;
  const active=teachers.filter(x=>x.status==='approved').length;
  const pending=teachers.filter(x=>x.status==='pending').length;
  const rejected=teachers.filter(x=>x.status==='rejected').length;
  $('adminStats').innerHTML=`
   <div class="stat"><strong>${total}</strong><span>Total Guru</span></div>
   <div class="stat"><strong>${active}</strong><span>Guru Aktif</span></div>
   <div class="stat"><strong>${pending}</strong><span>Menunggu Persetujuan</span></div>
   <div class="stat"><strong>${rejected}</strong><span>Guru Ditolak</span></div>
   <div class="stat"><strong>${cs.size}</strong><span>Total Kelas</span></div>`;
  await adminTab('guru');
 }catch(e){
  $('adminStats').innerHTML=`<div class="empty">Gagal memuat statistik: ${esc(errText(e))}</div>`;
  $('adminSection').innerHTML='<div class="empty">Periksa izin akses Firestore lalu muat ulang halaman.</div>';
 }
}

window.adminTab=async tab=>{
 const el=$('adminSection');
 el.innerHTML='<div class="empty">Memuat…</div>';
 try{
  if(tab==='guru'){
   const s=await getDocs(collection(db,'users'));
   const ts=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role==='guru');
   el.innerHTML=ts.length?`<div class="items">${ts.map(t=>item(t.nama,`
    <p class="muted">${esc(t.email)}</p>
    <span class="tag ${esc(t.status)}">${esc(t.status)}</span>
    <div class="actions">
     ${t.status!=='approved'?`<button class="small-btn" onclick="setStatus('${t.id}','approved')">Terima</button>`:''}
     ${t.status!=='rejected'?`<button class="danger" onclick="setStatus('${t.id}','rejected')">Tolak</button>`:''}
    </div>`)).join('')}</div>`:'<div class="empty">Belum ada akun guru.</div>';
  }else if(tab==='materi'){
   el.innerHTML=`
   <h3>Tambah materi</h3>
   <form id="matForm" class="inline">
    <div class="field"><label>Judul materi</label><input id="mtitle" required maxlength="120"></div>
    <div class="field"><label>Link materi (opsional)</label><input id="mlink" type="url" placeholder="https://..."></div>
    <div class="field full"><label>Deskripsi</label><textarea id="mdesc" rows="3"></textarea></div>
    <div class="full"><button class="submit">Simpan materi</button><p id="matMsg" class="message"></p></div>
   </form><div id="materials" class="items"></div>`;
   $('matForm').addEventListener('submit',saveMaterial);
   await loadMaterials('materials',true);
  }else{
   const s=await getDocs(collection(db,'classes'));
   el.innerHTML=s.size?`<div class="items">${s.docs.map(d=>item(d.data().nama,`
    <p class="muted">${esc(d.data().ownerEmail)}</p>
    <div class="code">${esc(d.data().kode)}</div>
    <div class="actions"><button class="danger" onclick="deleteClass('${d.id}')">Hapus kelas</button></div>
   `)).join('')}</div>`:'<div class="empty">Belum ada kelas.</div>';
  }
 }catch(e){el.innerHTML=`<div class="empty">${esc(errText(e))}</div>`}
};

window.setStatus=async(id,status)=>{
 try{await updateDoc(doc(db,'users',id),{status});adminTab('guru')}
 catch(e){alert(errText(e))}
};
async function saveMaterial(e){
 e.preventDefault();
 try{
  await addDoc(collection(db,'materials'),{
   judul:$('mtitle').value.trim(),
   link:$('mlink').value.trim(),
   deskripsi:$('mdesc').value.trim(),
   ownerUid:profile.uid,createdAt:serverTimestamp()
  });
  $('matMsg').textContent='Materi tersimpan.';
  $('matMsg').classList.add('ok');
  $('matForm').reset();
  await loadMaterials('materials',true);
 }catch(e){$('matMsg').textContent=errText(e)}
}
async function loadMaterials(id,admin=false,classId=null){
 const s=await getDocs(collection(db,'materials'));
 const ms=s.docs.map(d=>({id:d.id,...d.data()}))
  .filter(m=>!classId||!m.classId||m.classId===classId);
 $(id).innerHTML=ms.length?ms.map(m=>item(m.judul,`
  <p class="muted">${esc(m.deskripsi||'')}</p>
  ${m.link?`<p><a href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">Buka materi ↗</a></p>`:''}
  ${admin?`<div class="actions">
   <button class="small-btn" onclick="editMaterial('${m.id}')">Edit</button>
   <button class="danger" onclick="deleteMaterial('${m.id}')">Hapus</button>
  </div>`:''}
 `)).join(''):'<div class="empty">Belum ada materi.</div>';
}
window.editMaterial=async id=>{
 const s=await getDoc(doc(db,'materials',id));
 if(!s.exists())return;
 const m=s.data();
 $('mtitle').value=m.judul||'';
 $('mlink').value=m.link||'';
 $('mdesc').value=m.deskripsi||'';
 $('matMsg').textContent='Mode edit: klik Simpan materi untuk memperbarui.';
 $('matForm').onsubmit=async e=>{
  e.preventDefault();
  try{
   await updateDoc(doc(db,'materials',id),{
    judul:$('mtitle').value.trim(),
    link:$('mlink').value.trim(),
    deskripsi:$('mdesc').value.trim()
   });
   $('matForm').reset();
   $('matForm').onsubmit=saveMaterial;
   await loadMaterials('materials',true);
  }catch(e){$('matMsg').textContent=errText(e)}
 };
};
window.deleteMaterial=async id=>{
 if(!confirm('Hapus materi ini?'))return;
 try{await deleteDoc(doc(db,'materials',id));await loadMaterials('materials',true)}
 catch(e){alert(errText(e))}
};
window.deleteClass=async id=>{
 if(!confirm('Hapus kelas ini?'))return;
 try{await deleteDoc(doc(db,'classes',id));adminTab('kelas')}
 catch(e){alert(errText(e))}
};

async function teacherDashboard(){
 $('content').innerHTML=`
 <section class="panel">
  <h2>Ruang Guru</h2>
  <p class="muted">Guru yang disetujui dapat membuat kelas dan membagikan kode kepada murid. Guru tidak menambah atau mengedit materi.</p>
  <form id="classForm" class="inline">
   <div class="field"><label>Nama kelas</label><input id="cname" required maxlength="80" placeholder="Contoh: X-1 Peluang"></div>
   <div class="field"><label>Keterangan (opsional)</label><input id="cdesc" maxlength="120" placeholder="Matematika"></div>
   <div class="full"><button class="submit">+ Buat kelas</button><p id="cmsg" class="message"></p></div>
  </form>
 </section>
 <section class="panel">
  <h2>Kelas Saya</h2><p class="muted">Bagikan kode kelas di bawah kepada murid.</p>
  <div id="myClasses" class="items"></div>
 </section>`;
 $('classForm').addEventListener('submit',createClass);
 await loadClasses();
}
function genCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function createClass(e){
 e.preventDefault();
 try{
  const all=await getDocs(collection(db,'classes'));
  let kode=genCode();
  while(all.docs.some(d=>d.data().kode===kode))kode=genCode();
  await addDoc(collection(db,'classes'),{
   nama:$('cname').value.trim(),deskripsi:$('cdesc').value.trim(),
   kode,ownerUid:profile.uid,ownerEmail:profile.email,
   createdAt:serverTimestamp()
  });
  $('cmsg').textContent='Kelas berhasil dibuat. Kode: '+kode;
  $('cmsg').classList.add('ok');
  $('classForm').reset();await loadClasses();
 }catch(e){$('cmsg').textContent=errText(e)}
}
async function loadClasses(){
 const s=await getDocs(query(collection(db,'classes'),where('ownerUid','==',profile.uid)));
 $('myClasses').innerHTML=s.size?s.docs.map(d=>item(d.data().nama,`
  <p class="muted">${esc(d.data().deskripsi||'')}</p>
  <div class="code">${esc(d.data().kode)}</div>
  <p class="muted">Bagikan kode ini kepada murid.</p>
  <div class="actions">
   <button class="small-btn" onclick="copyCode('${esc(d.data().kode)}')">Salin kode</button>
   <button class="danger" onclick="teacherDeleteClass('${d.id}')">Hapus kelas</button>
  </div>
 `)).join(''):'<div class="empty">Kamu belum membuat kelas.</div>';
}
window.copyCode=async c=>{
 try{await navigator.clipboard.writeText(c);alert('Kode kelas disalin: '+c)}
 catch{prompt('Salin kode kelas:',c)}
};
window.teacherDeleteClass=async id=>{
 if(!confirm('Hapus kelas ini?'))return;
 try{await deleteDoc(doc(db,'classes',id));loadClasses()}
 catch(e){alert(errText(e))}
};

async function showStudentDashboard(){
 showShell(student.nama+' · Murid · Kelas '+student.kode);
 $('content').innerHTML=`
 <section class="panel">
  <h2>Halo, ${esc(student.nama)}! 👋</h2>
  <p class="muted">Selamat datang di kelas <strong>${esc(student.data.nama)}</strong>.</p>
  <div class="code">Kode kelas: ${esc(student.kode)}</div>
  <p class="muted">${esc(student.data.deskripsi||'')}</p>
  <div class="tabs">
   <button onclick="studentTab('materi')">Materi</button>

 </section>
 <div id="studentSection"></div>`;

window.studentTab=async tab=>{
 const el=$('studentSection');
 if(tab==='soal'){
  el.innerHTML='<section class="panel"><h2>Soal Latihan</h2><div class="empty">Belum ada soal yang tersedia.</div></section>';
  return;
 }
 el.innerHTML=`
 <section class="panel">
  <h2>Materi Pembelajaran</h2>
  <p class="muted">Pelajari materi peluang melalui penjelasan dan simulasi interaktif berikut.</p>
  <div id="studentMaterials" class="items"></div>
  <div id="peluangMount"></div>
 </section>`;
 await loadMaterials('studentMaterials',false,student.id);
 mountPeluang();
};
</script>

  <script>
function mountPeluang(){
 const host=document.getElementById('peluangMount');
 if(!host||host.dataset.ready)return;
 host.dataset.ready='1';

 host.innerHTML=`
 <div class="peluang-module">
  <div class="pm-hero">
   <div class="pm-small">MEDIA PEMBELAJARAN INTERAKTIF</div>
   <h2>✨ Ayo Dalami Peluang!</h2>
   <p>Eksplorasi ruang sampel, kejadian, peluang, frekuensi harapan, dan percobaan koin serta dadu.</p>
  </div>

  <div class="pm-card">
   <h3>📘 Petunjuk penggunaan</h3>
   <p>Baca konsep terlebih dahulu, lalu coba simulasi. Gunakan tombol untuk melakukan percobaan dan amati hasilnya.</p>
  </div>

  <div class="pm-card">
   <h3>1. Konsep dasar peluang</h3>
   <div class="pm-grid">
    <div><b>Percobaan</b><p>Kegiatan yang hasilnya belum dapat dipastikan sebelum dilakukan, misalnya melempar koin atau dadu.</p></div>
    <div><b>Ruang sampel (S)</b><p>Himpunan semua hasil yang mungkin dari suatu percobaan.</p></div>
    <div><b>Kejadian (A)</b><p>Himpunan bagian dari ruang sampel yang menjadi perhatian.</p></div>
    <div><b>Rumus peluang</b><p>P(A) = n(A) / n(S), untuk hasil yang memiliki kesempatan sama.</p></div>
   </div>
   <div class="pm-result">Contoh: pelemparan dadu, S = {1, 2, 3, 4, 5, 6}. Jika A = muncul bilangan genap, A = {2, 4, 6}, maka P(A) = 3/6 = 1/2.</div>
  </div>

  <div class="pm-card">
   <h3>2. Ruang sampel dua dadu</h3>
   <p>Pilih tampilan untuk memahami pasangan hasil dua dadu.</p>
   <select id="pmTree" onchange="pmDrawTree()">
    <option value="table">Tabel pasangan dua dadu</option>
    <option value="sum">Kelompok berdasarkan jumlah</option>
   </select>
   <div id="pmTreeView"></div>
  </div>

  <div class="pm-card">
   <h3>3. Simulasi pelemparan koin</h3>
   <p>Sisi koin terdiri atas angka (A) dan gambar (G). Lakukan percobaan dan bandingkan frekuensi relatifnya.</p>
   <div class="pm-coins" id="pmCoinFace">🪙</div>
   <button onclick="pmFlip(1)">Lempar 1 kali</button>
   <button onclick="pmFlip(10)">Lempar 10 kali</button>
   <button class="pm-light" onclick="pmReset()">Reset</button>
   <div class="pm-result" id="pmCoinStats">Total: 0 kali | Angka: 0 | Gambar: 0</div>
   <div class="pm-history" id="pmCoinHistory"></div>
  </div>

  <div class="pm-card">
   <h3>4. Frekuensi harapan</h3>
   <p>Frekuensi harapan = banyak percobaan × peluang kejadian.</p>
   <label>Banyak percobaan (n) <input id="pmN" type="number" min="0" value="100"></label>
   <label>Peluang kejadian P(A) <input id="pmP" type="number" min="0" max="1" step="0.01" value="0.5"></label>
   <button onclick="pmExpected()">Hitung</button>
   <div class="pm-result" id="pmExpectedResult">Hasil perhitungan akan tampil di sini.</div>
  </div>

  <div class="pm-card">
   <h3>5. Peluang dua kejadian</h3>
   <div class="pm-grid">
    <div><b>Saling lepas</b><p>P(A ∪ B) = P(A) + P(B), jika A dan B tidak dapat terjadi bersamaan.</p></div>
    <div><b>Tidak saling lepas</b><p>P(A ∪ B) = P(A) + P(B) − P(A ∩ B).</p></div>
    <div><b>Saling bebas</b><p>P(A ∩ B) = P(A) × P(B).</p></div>
    <div><b>Peluang bersyarat</b><p>P(A|B) = P(A ∩ B) / P(B), dengan P(B) ≠ 0.</p></div>
   </div>
  </div>

  <div class="pm-card">
   <h3>6. Percobaan gabungan koin dan dadu</h3>
   <p>Setiap percobaan menghasilkan satu sisi koin (A/G) dan satu angka dadu (1–6). Kedua percobaan dianggap saling bebas.</p>
   <button onclick="pmIndependent(1)">Coba 1 kali</button>
   <button onclick="pmIndependent(10)">Coba 10 kali</button>
   <button class="pm-light" onclick="pmIndReset()">Reset</button>
   <div class="pm-result" id="pmIndResult">Belum ada percobaan.</div>
   <div class="pm-history" id="pmIndHistory"></div>
  </div>

  <div class="pm-card">
   <h3>7. Misi eksplorasi dadu 3D 🎲</h3>
   <div class="pm-mission">
    <b id="pmMissionTitle">Misi 1 — Mengamati hasil dadu</b>
    <p id="pmMissionDesc">Lempar dadu dan amati hasil yang muncul.</p>
    <div class="pm-die" id="pmDie">⚄</div>
    <div>
     <button onclick="pmRoll()">Lempar dadu</button>
     <button class="pm-light" onclick="pmNextMission()">Misi berikutnya</button>
    </div>
    <div class="pm-result" id="pmMissionResult">Hasil pengamatan akan muncul di sini.</div>
   </div>
  </div>
 </div>`;
 pmDrawTree();
 pmSetMission();
}

function pmDrawTree(){
 let v=document.getElementById('pmTreeView');
 if(!v)return;
 let mode=document.getElementById('pmTree').value;
 if(mode==='table'){
  let h='<table class="pm-table"><tr><th>Dadu 1 / Dadu 2</th>'+
   [1,2,3,4,5,6].map(x=>'<th>'+x+'</th>').join('')+'</tr>';
  for(let i=1;i<=6;i++){
   h+='<tr><th>'+i+'</th>'+
   [1,2,3,4,5,6].map(j=>'<td>('+i+','+j+')</td>').join('')+'</tr>';
  }
  v.innerHTML=h+'</table><p class="pm-small">Jumlah titik sampel = 6 × 6 = 36.</p>';
 }else{
  v.innerHTML='<div class="pm-grid">'+Array.from({length:11},(_,i)=>{
   let sum=i+2,arr=[];
   for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b===sum)arr.push('('+a+','+b+')');
   return '<div class="pm-result"><b>Jumlah '+sum+'</b><br>'+arr.join(' ')+'</div>';
  }).join('')+'</div>';
 }
}

let pmA=0,pmG=0,pmHist=[];
function pmFlip(n){
 let last='';
 for(let i=0;i<n;i++){
  last=Math.random()<.5?'A':'G';
  if(last==='A')pmA++;else pmG++;
  pmHist.unshift(last);
 }
 document.getElementById('pmCoinFace').textContent=last==='A'?'🪙 A (Angka)':'🪙 G (Gambar)';
 let t=pmA+pmG;
 document.getElementById('pmCoinStats').innerHTML=
  `Total: ${t} kali | Angka: ${pmA} (${t?(pmA/t*100).toFixed(1):0}%) | Gambar: ${pmG} (${t?(pmG/t*100).toFixed(1):0}%)`;
 document.getElementById('pmCoinHistory').textContent='Riwayat terbaru: '+pmHist.slice(0,60).join(', ');
}
function pmReset(){
 pmA=pmG=0;pmHist=[];
 document.getElementById('pmCoinFace').textContent='🪙';
 document.getElementById('pmCoinStats').textContent='Total: 0 kali | Angka: 0 | Gambar: 0';
 document.getElementById('pmCoinHistory').textContent='';
}

function pmExpected(){
 let n=Number(document.getElementById('pmN').value);
 let p=Number(document.getElementById('pmP').value);
 document.getElementById('pmExpectedResult').textContent=
  (n>=0&&p>=0&&p<=1)?`Frekuensi harapan = ${n} × ${p} = ${n*p}.`:
  'Masukkan n ≥ 0 dan peluang antara 0 sampai 1.';
}

let pmInd=[],pmIndA=0,pmIndEven=0,pmIndBoth=0;
function pmIndependent(n){
 for(let i=0;i<n;i++){
  let c=Math.random()<.5?'A':'G';
  let d=1+Math.floor(Math.random()*6);
  pmInd.push(c+d);
  if(c==='A')pmIndA++;
  if(d%2===0)pmIndEven++;
  if(c==='A'&&d%2===0)pmIndBoth++;
 }
 let t=pmInd.length;
 document.getElementById('pmIndResult').innerHTML=
  `Total percobaan: ${t}<br>Koin angka: ${pmIndA}<br>Dadu genap: ${pmIndEven}<br>Koin angka dan dadu genap: ${pmIndBoth}<br>Frekuensi relatif kejadian bersama: ${(pmIndBoth/t*100).toFixed(1)}%`;
 document.getElementById('pmIndHistory').textContent='Hasil: '+pmInd.slice(-50).join(', ');
}
function pmIndReset(){
 pmInd=[];pmIndA=pmIndEven=pmIndBoth=0;
 document.getElementById('pmIndResult').textContent='Belum ada percobaan.';
 document.getElementById('pmIndHistory').textContent='';
}

const pmMissions=[
 ['Misi 1 — Mengamati hasil dadu','Lempar dadu dan catat satu hasil yang muncul.'],
 ['Misi 2 — Bilangan genap','Amati apakah hasil dadu termasuk bilangan genap.'],
 ['Misi 3 — Bilangan ganjil','Amati apakah hasil dadu termasuk bilangan ganjil.'],
 ['Misi 4 — Peluang angka 6','Lakukan beberapa lemparan dan hitung kemunculan angka 6.'],
 ['Misi 5 — Kurang dari 4','Tentukan apakah hasil dadu kurang dari 4.'],
 ['Misi 6 — Lebih dari 3','Tentukan apakah hasil dadu lebih dari 3.'],
 ['Misi 7 — Frekuensi relatif','Lakukan 10 lemparan dan amati frekuensi hasil genap.'],
 ['Misi 8 — Ruang sampel','Ingat kembali enam hasil yang mungkin pada dadu.'],
 ['Misi 9 — Kesimpulan','Bandingkan peluang teoretis dan hasil percobaan.']
];
let pmMi=0,pmRolls=[];
function pmSetMission(){
 document.getElementById('pmMissionTitle').textContent=pmMissions[pmMi][0];
 document.getElementById('pmMissionDesc').textContent=pmMissions[pmMi][1];
 document.getElementById('pmMissionResult').textContent='Lakukan lemparan untuk menyelesaikan misi.';
}
function pmNextMission(){
 pmMi=(pmMi+1)%pmMissions.length;
 pmRolls=[];
 document.getElementById('pmDie').textContent='⚄';
 pmSetMission();
}
function pmRoll(){
 let n=1+Math.floor(Math.random()*6);
 pmRolls.push(n);
 document.getElementById('pmDie').textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][n];
 document.getElementById('pmMissionResult').textContent=
  `Hasil lemparan: ${n}. Total lemparan pada misi ini: ${pmRolls.length}. Hasil tercatat: ${pmRolls.join(', ')}.`;
}
</script>
