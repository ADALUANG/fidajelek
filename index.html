<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayo Dalami Peluang! — ADALUANG</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--purple:#8056d9;--dark:#35256c;--muted:#8984a5}
body{min-height:100vh;font-family:Nunito,sans-serif;color:var(--dark);overflow-x:hidden;background:radial-gradient(ellipse at 3% 28%,#f0e4ff 0%,transparent 34%),radial-gradient(ellipse at 99% 78%,#fff0f8 0%,transparent 32%),#fcfaff}
button,input,textarea{font:inherit}
button{cursor:pointer}
.page{min-height:100vh;display:grid;grid-template-columns:1.04fr 1.12fr .91fr;align-items:center;gap:30px;padding:55px 7.8%}
.pill{display:inline-block;padding:10px 17px;border-radius:30px;background:#f0e7ff;color:#8a66cf;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:32px}
h1{font-size:clamp(43px,3.8vw,62px);line-height:1.06;letter-spacing:-1.5px;font-weight:900;color:#35256c}
h1 span{display:block;color:#8056d9}
.description{color:#8984a5;font-size:16px;font-weight:700;line-height:1.9;margin-top:23px;max-width:410px}
.math{margin-top:61px;font-size:19px;font-style:italic;color:#9879d1}
.left-art{width:100%;max-width:390px;margin-top:12px;display:block}
.center{width:100%;max-width:460px;justify-self:center;background:#ffffffef;border:1px solid #f1ecf8;border-radius:29px;padding:28px 29px 40px;box-shadow:0 22px 65px #664c9917;text-align:center}
.center h2{font-size:28px;font-weight:900;line-height:1.4}
.sub{color:#8984a5;font-size:16px;font-weight:700;margin:2px 0 21px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room{border:1px solid transparent;border-radius:21px;min-width:0;padding:17px 13px 15px;text-align:left;color:#352d55;transition:.2s}
.room:hover{transform:translateY(-4px);box-shadow:0 10px 22px #60468b15}
.teacher{background:linear-gradient(145deg,#f8f2ff,#eee7ff);border-color:#eae0fb}
.student{background:linear-gradient(145deg,#eff8ff,#e0f1ff);border-color:#deedfb}
.avatar{width:67px;height:67px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#e1d0ff;font-size:34px}
.student .avatar{background:#cce9ff}
.room h3{font-size:16px;font-weight:900;white-space:nowrap}
.room p{font-size:11px;line-height:1.5;color:#8984a5;min-height:34px;margin-top:4px}
.arrow{margin-top:7px;height:31px;width:31px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:white;background:#b89be9;font-size:21px}
.student .arrow{background:#79b8e9}
.register{margin-top:28px;color:#8984a5;font-size:12px}
.register button{background:none;border:0;color:#8056d9;font-weight:900;margin-left:5px}
.right{text-align:center}
.quote{font-size:15px;font-style:italic;line-height:1.8;color:#8984a5;margin-bottom:48px}
.formula{font-size:19px;font-style:italic;color:#a087d6;text-align:left}
.right-art{width:100%;max-width:370px;margin:auto;display:block}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#2b1d4988;backdrop-filter:blur(5px);justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal-card{width:100%;max-width:430px;background:white;border-radius:25px;padding:30px;max-height:92vh;overflow:auto}
.modal-card h2{font-size:26px;margin-bottom:6px}
.modal-card>p{font-size:14px;color:var(--muted);margin-bottom:22px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:13px;border:1px solid #e6def4;border-radius:12px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--purple)}
.submit,.secondary,.danger,.small-btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900}
.submit{width:100%;background:var(--purple);color:white}
.submit:disabled{opacity:.6;cursor:wait}
.secondary,.small-btn{background:#f0e7ff;color:#6e49bd}
.danger{background:#fff0f2;color:#b3425a}
.cancel{width:100%;background:none;border:0;padding:12px;color:var(--muted)}
.message{font-size:13px;color:#b3425a;margin-top:12px;line-height:1.5}
.ok{color:#23866b!important}
.hidden{display:none!important}
.app{display:none;min-height:100vh;padding:24px;background:#fcfaff}
.app.show{display:block}
.app-top,.content{max-width:1100px;margin:auto}
.app-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:24px;font-weight:900}
.brand span{color:var(--purple)}
.userline{font-size:13px;font-weight:800;margin-bottom:6px;text-align:right}
.panel{background:white;border:1px solid #f1ecf8;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 15px 45px #664c9910}
.panel h2{font-size:25px;margin-bottom:7px}
.muted{color:var(--muted);font-size:14px;line-height:1.6}
.stats,.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat,.item{padding:16px;border:1px solid #eee6fa;border-radius:16px;overflow-wrap:anywhere}
.stat{background:#f7f1ff}
.stat strong{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.item h3{margin-bottom:8px}
.item p{margin:7px 0}
.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs button{background:#f4effc;color:#6e49bd;border:0;border-radius:10px;padding:10px 16px;font-weight:900;font-family:Nunito,sans-serif}
.tabs button.active{background:#8056d9;color:white}
.code{display:inline-block;font-weight:900;letter-spacing:2px;color:#6845ae;background:#f0e7ff;padding:8px 12px;border-radius:10px;margin:6px 0}
.tag{display:inline-block;font-size:11px;font-weight:900;border-radius:20px;padding:5px 9px;background:#f0e7ff;color:#6e49bd}
.pending{background:#fff3d7;color:#946b08}
.approved{background:#e2f8ee;color:#23866b}
.rejected{background:#fff0f2;color:#b3425a}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.inline .full{grid-column:1/-1}
.empty{padding:22px;border:1px dashed #d9c9f2;border-radius:16px;color:var(--muted);font-size:14px;text-align:center}
.student-menu{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.student-menu button{flex:1;min-width:120px;padding:14px 12px;border:1px solid #e8def8;border-radius:14px;background:#f4effc;color:#6e49bd;font-weight:900;font-size:14px;position:relative;font-family:Nunito,sans-serif}
.student-menu button.active{background:#8056d9;color:white;border-color:#8056d9}
.student-content{margin-top:10px}

/* Kartu menu materi */
.materi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.materi-card{background:linear-gradient(145deg,#f8f2ff,#eee7ff);border:2px solid #eae0fb;border-radius:20px;padding:24px 20px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:Nunito,sans-serif}
.materi-card:hover{transform:translateY(-5px);box-shadow:0 12px 28px #60468b22}
.materi-card .materi-icon{font-size:48px;display:block;margin-bottom:12px;line-height:1}
.materi-card h3{font-size:17px;font-weight:900;color:#35256c;margin:0 0 8px}
.materi-card p{font-size:12px;color:#8984a5;line-height:1.5;margin:0 0 14px;min-height:38px}
.materi-card .materi-btn{display:inline-block;padding:9px 20px;border-radius:10px;background:#8056d9;color:white;font-weight:900;font-size:13px}
.materi-frame-wrap{margin-top:16px;border-radius:18px;overflow:hidden;border:1px solid #f1ecf8;background:white;box-shadow:0 8px 24px #664c9910}
.materi-frame-wrap iframe{width:100%;height:calc(100vh - 260px);min-height:600px;border:0;display:block}
.materi-back{display:inline-flex;align-items:center;gap:8px;background:#f4effc;color:#6e49bd;border:0;border-radius:10px;padding:10px 18px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:18px;font-family:Nunito,sans-serif}
.materi-back:hover{background:#e8dcfb}

/* Latihan */
.practice-area{margin-top:10px}
.practice-area h3{font-size:20px;margin-bottom:8px;color:#35256c}
.practice-back{display:inline-flex;align-items:center;gap:8px;background:#f4effc;color:#6e49bd;border:0;border-radius:10px;padding:10px 18px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:18px;font-family:Nunito,sans-serif}
.practice-back:hover{background:#e8dcfb}
.practice-btn{border:0;border-radius:12px;padding:12px 22px;font-weight:900;font-size:14px;background:#8056d9;color:white;cursor:pointer;margin-top:16px;font-family:Nunito,sans-serif;transition:.2s}
.practice-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.practice-btn.secondary{background:#f0e7ff;color:#6e49bd;margin-top:10px;font-size:13px;padding:9px 16px}
.practice-btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.question-card{background:#f8f2ff;border:1px solid #eae0fb;border-radius:16px;padding:18px;margin-bottom:14px}
.question-card h4{font-size:15px;font-weight:800;color:#35256c;margin:8px 0 14px;line-height:1.6}
.question-number{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1.5px;color:#6e49bd;background:#f0e7ff;padding:4px 10px;border-radius:20px}
.question-option{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid #e8def8;border-radius:12px;margin-bottom:9px;cursor:pointer;background:white;transition:.15s;font-size:14px;font-weight:700;color:#4a3f6b}
.question-option:hover{border-color:#c4aef0;background:#faf5ff}
.question-option input{accent-color:#8056d9;width:18px;height:18px;flex-shrink:0}
.question-option:has(input:checked){border-color:#8056d9;background:#f0e7ff}
.question-card textarea{width:100%;min-height:90px;padding:13px;border:2px solid #e8def8;border-radius:12px;font-family:Nunito,sans-serif;font-size:14px;resize:vertical;outline:none;color:#35256c;background:white}
.question-card textarea:focus{border-color:#8056d9}
.practice-result{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#eaf9f2;border-left:4px solid #23866b;color:#1a5f4d;font-size:14px;line-height:1.7}
.practice-result.show{display:block;animation:appearS .3s ease}
@keyframes appearS{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.practice-result strong{color:#166534}
.practice-result p{margin:8px 0;line-height:1.6}

/* Kuis */
.kuis-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kuis-progress{flex:1;min-width:200px}
.kuis-progress-bar{height:8px;background:#f0e7ff;border-radius:4px;overflow:hidden;margin-top:6px}
.kuis-progress-fill{height:100%;background:linear-gradient(90deg,#8056d9,#a887e8);transition:width .3s}
.kuis-progress-text{font-size:12px;color:#8984a5;font-weight:800}
.kuis-nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.kuis-nav button{flex:1;min-width:120px}
.kuis-type-badge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;padding:4px 10px;border-radius:20px;background:#f0e7ff;color:#6e49bd;margin-bottom:10px}
.kuis-question{background:#f8f2ff;border:1px solid #eae0fb;border-radius:18px;padding:22px;margin-bottom:16px}
.kuis-question h4{font-size:16px;font-weight:800;color:#35256c;margin:8px 0 18px;line-height:1.7}
.kuis-input{width:100%;min-height:120px;padding:14px;border:2px solid #e8def8;border-radius:12px;font-family:Nunito,sans-serif;font-size:14px;resize:vertical;outline:none;color:#35256c;background:white}
.kuis-input:focus{border-color:#8056d9}
.kuis-match-row{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee6fa}
.kuis-match-row:last-child{border-bottom:0}
.kuis-match-row strong{font-size:14px;color:#35256c}
.kuis-match-row select{width:100%;padding:11px;border:2px solid #e8def8;border-radius:10px;font-family:Nunito,sans-serif;font-size:13px;background:white;color:#35256c;cursor:pointer;outline:none}
.kuis-match-row select:focus{border-color:#8056d9}
.kuis-drag-items{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;padding:14px;background:#f8f2ff;border:1px dashed #d4c4f5;border-radius:14px}
.kuis-drag-item{padding:10px 18px;background:white;border:2px solid #e8def8;border-radius:10px;font-weight:900;color:#35256c;cursor:grab;user-select:none;transition:.15s;font-size:14px}
.kuis-drag-item:hover{border-color:#8056d9;background:#faf5ff}
.kuis-drag-item.selected{border-color:#8056d9;background:#f0e7ff}
.kuis-drop-zone{padding:16px;border:2px dashed #c4aef0;border-radius:12px;background:white;text-align:center;color:#8984a5;font-weight:700;font-size:13px;margin-top:10px;cursor:pointer;transition:.15s;min-height:52px;display:flex;align-items:center;justify-content:center}
.kuis-drop-zone:hover{background:#faf5ff;border-color:#8056d9}
.kuis-drop-zone.filled{border-style:solid;border-color:#8056d9;background:#f0e7ff;color:#35256c;font-size:15px}
.kuis-summary{background:#f0e7ff;border-left:4px solid #8056d9;border-radius:14px;padding:18px;margin:15px 0;color:#4c2d8f;font-size:14px;line-height:1.7}
.kuis-summary strong{color:#35256c}
.kuis-score{font-size:42px;font-weight:900;color:#8056d9;line-height:1;margin:10px 0}
.kuis-predikat{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:900;font-size:13px;margin-top:6px}
.kuis-predikat.a{background:#e2f8ee;color:#166534}
.kuis-predikat.b{background:#e8f4ff;color:#1e5a9c}
.kuis-predikat.c{background:#fff3d7;color:#946b08}
.kuis-predikat.d{background:#ffe8d4;color:#a85617}
.kuis-predikat.e{background:#fff0f2;color:#b3425a}

/* Monitoring */
.feedback-panel{background:#eaf9f2;border-left:4px solid #23866b;border-radius:14px;padding:16px;margin:14px 0;color:#1a5f4d;font-size:14px;line-height:1.7}
.feedback-panel strong{color:#166534}
.feedback-panel .meta{font-size:12px;color:#23866b;font-weight:700;margin-top:8px;display:block}
.template-btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.template-btns button{background:#f0e7ff;color:#6e49bd;border:0;border-radius:10px;padding:9px 14px;font-weight:900;font-size:12px;cursor:pointer;font-family:Nunito,sans-serif;transition:.15s}
.template-btns button:hover{background:#e0d0ff;transform:translateY(-1px)}
.summary-box{background:#f8f2ff;border:1px solid #eae0fb;border-radius:16px;padding:18px;margin:15px 0}
.summary-box h4{font-size:15px;color:#35256c;margin:0 0 10px}
.summary-box p{font-size:13px;color:#4a3f6b;margin:5px 0;line-height:1.6}
.summary-box .warn{color:#b3425a;font-weight:800}
.summary-box .good{color:#23866b;font-weight:800}
.monitor-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.monitor-table th,.monitor-table td{padding:11px 10px;border-bottom:1px solid #eee6fa;text-align:left}
.monitor-table th{background:#f0e7ff;color:#6845ae;font-weight:900;font-size:12px}
.monitor-table tr:hover{background:#faf5ff}
.monitor-table td.score{font-weight:800;color:#35256c}
.monitor-table td.done{color:#23866b;font-weight:800}
.monitor-table td.pending{color:#946b08;font-weight:800}
.monitor-table td.low{color:#b3425a;font-weight:800}
.monitor-table button{background:#8056d9;color:white;border:0;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:Nunito,sans-serif}
.monitor-table button:hover{filter:brightness(1.08)}
.bulk-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0;padding:12px 15px;background:#f8f2ff;border:1px dashed #d4c4f5;border-radius:12px;font-size:13px}
.bulk-bar button{background:#8056d9;color:white;border:0;border-radius:8px;padding:8px 14px;font-weight:900;font-size:12px;cursor:pointer;font-family:Nunito,sans-serif}
.bulk-bar button:disabled{opacity:.5;cursor:not-allowed}
.monitor-table input[type="checkbox"]{accent-color:#8056d9;width:16px;height:16px}
.detail-section{margin:16px 0}
.detail-section h4{font-size:14px;color:#6845ae;margin:0 0 8px;font-weight:900}
.detail-item{display:flex;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:6px;line-height:1.5;flex-wrap:wrap}
.detail-item.correct{background:#eaf9f2;color:#166534}
.detail-item.wrong{background:#fff0f2;color:#b3425a}
.detail-item.empty{background:#f8f2ff;color:#8984a5}
.detail-item strong{flex-shrink:0;font-weight:800}
.riwayat-item{background:#f8f2ff;border:1px solid #eae0fb;border-radius:12px;padding:14px;margin-bottom:10px}
.riwayat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.riwayat-head strong{font-size:13px;color:#35256c}
.riwayat-head span{font-size:12px;color:#8984a5}
.riwayat-score{font-weight:900;color:#8056d9;font-size:14px}

@media(max-width:1100px){.page{grid-template-columns:1fr 1.05fr;padding:45px 6%}.right{display:none}}
@media(max-width:650px){
.page{display:flex;flex-direction:column;gap:28px;padding:35px 20px}
.left{text-align:center;width:100%}
h1{font-size:45px}
.description{font-size:14px;margin:17px auto 0}
.pill{margin-bottom:23px}
.math,.left-art{display:none}
.center{padding:27px 17px 32px}
.center h2{font-size:25px}
.room{padding:15px 9px}
.room h3{font-size:14px}
.room p{font-size:10px}
.inline,.items,.stats{grid-template-columns:1fr}
.app{padding:14px}
.panel{padding:18px}
.app-top{align-items:flex-start}
.userline{max-width:180px}
.materi-frame-wrap iframe{height:70vh;min-height:500px}
.kuis-match-row{grid-template-columns:1fr;gap:6px}
.kuis-match-row strong{font-size:13px}
.student-menu button{min-width:100px;padding:12px 8px;font-size:12px}
}
</style>
</head>

<body>

<div id="landing">
<main class="page">
<section class="left">
<div class="pill">✦ RUANG BELAJAR DIGITAL</div>
<h1>Ayo Dalami <span>Peluang!</span></h1>
<p class="description">Belajar matematika jadi lebih seru, interaktif, dan dekat dengan kehidupan sehari-hari.</p>
<div class="math">P(A) = ?</div>
<svg class="left-art" viewBox="0 0 390 250">
<ellipse cx="190" cy="220" rx="172" ry="24" fill="#e8dcff"/>
<ellipse cx="200" cy="194" rx="126" ry="75" fill="#eee5ff"/>
<path d="M104 102Q102 42 150 37Q201 37 203 99L207 135L107 139Z" fill="#52318e"/>
<ellipse cx="153" cy="102" rx="36" ry="43" fill="#ffd9b9"/>
<path d="M117 94Q119 55 153 55Q187 57 189 92L178 75Q148 85 122 72Z" fill="#52318e"/>
<circle cx="140" cy="102" r="3" fill="#35256c"/>
<circle cx="166" cy="102" r="3" fill="#35256c"/>
<path d="M122 143Q153 128 182 144L205 194L101 194Z" fill="#a27ae9"/>
<rect x="139" y="177" width="111" height="53" rx="7" fill="#6845ae"/>
<rect x="145" y="182" width="99" height="42" rx="4" fill="#dff3ff"/>
<path d="M185 200L194 209L212 191" fill="none" stroke="#8e70d4" stroke-width="4"/>
<path d="M284 211Q285 174 277 145" stroke="#68b99c" stroke-width="6" fill="none"/>
<path d="M281 176Q239 164 250 135Q277 138 281 176Z" fill="#81c9a9"/>
<path d="M283 193Q309 151 331 166Q326 191 283 193Z" fill="#67b99b"/>
<path d="M261 208L310 208L302 239L270 239Z" fill="#b39ae8"/>
<text x="19" y="115" fill="#a58adf" font-size="20">✦</text>
</svg>
</section>

<section class="center">
<h2>Selamat datang!</h2>
<p class="sub">Pilih ruang belajarmu.</p>
<div class="rooms">
<button type="button" class="room teacher" onclick="openTeacher()">
<div class="avatar">👩🏻‍🏫</div>
<h3>Ruang Guru</h3>
<p>Kelola kelas dengan kode kelas</p>
<div class="arrow">➜</div>
</button>
<button type="button" class="room student" onclick="openStudent()">
<div class="avatar">🧑🏻‍🎓</div>

function errText(e){
const errors={'auth/invalid-credential':'Email atau kata sandi salah.','auth/email-already-in-use':'Email sudah terdaftar.','auth/weak-password':'Kata sandi minimal 6 karakter.','auth/invalid-email':'Format email tidak valid.','permission-denied':'Akses ditolak. Periksa Firestore Rules.'};
return errors[e.code]||e.message||'Terjadi kesalahan.';
}

async function getProfile(u){
const r=doc(db,'users',u.uid);
const s=await getDoc(r);
if(s.exists())return s.data();
if((u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase()){
const p={nama:'Admin ADALUANG',email:u.email,role:'admin',status:'approved',createdAt:serverTimestamp()};
await setDoc(r,p);
return p;
}
return null;
}

$('form').addEventListener('submit',async e=>{
e.preventDefault();
$('submit').disabled=true;
try{
if(mode==='register'){
const nama=$('name').value.trim();
const email=$('email').value.trim().toLowerCase();
const password=$('password').value;
if(!nama)throw Error('Nama wajib diisi.');
if(email===ADMIN_EMAIL.toLowerCase())throw Error('Email admin tidak bisa digunakan untuk pendaftaran guru.');
const c=await createUserWithEmailAndPassword(auth,email,password);
await setDoc(doc(db,'users',c.user.uid),{nama,email,role:'guru',status:'pending',createdAt:serverTimestamp()});
await signOut(auth);
say('Pendaftaran berhasil. Tunggu persetujuan admin.',true);
return;
}
if(mode==='student'){
const nama=$('name').value.trim();
const kode=$('code').value.trim().toUpperCase();
if(!nama||!kode)throw Error('Nama dan kode kelas wajib diisi.');
const s=await getDocs(collection(db,'classes'));
const d=s.docs.find(x=>(x.data().kode||'').toUpperCase()===kode);
if(!d)throw Error('Kode kelas tidak ditemukan. Periksa kembali kode dari guru.');
student={nama,kode,id:d.id,data:d.data()};
closeModal();
renderStudent();
return;
}
await signInWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('password').value);
closeModal();
}catch(e){
say(errText(e));
}finally{
$('submit').disabled=false;
}
});

onAuthStateChanged(auth,async u=>{
if(!u){profile=null;return;}
try{
let p=await getProfile(u);
if(!p){await signOut(auth);alert('Profil akun tidak ditemukan. Daftar akun guru terlebih dahulu.');return;}
if(u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()&&p.role!=='admin'){
await updateDoc(doc(db,'users',u.uid),{role:'admin',status:'approved'});
p.role='admin';p.status='approved';
}
if(p.role==='guru'&&p.status!=='approved'){
await signOut(auth);
alert(p.status==='rejected'?'Akun guru ditolak admin.':'Akun guru masih menunggu persetujuan admin.');
return;
}
if(!['admin','guru'].includes(p.role)){
await signOut(auth);
alert('Peran akun tidak valid.');
return;
}
profile={...p,uid:u.uid,email:u.email};
student=null;
showDashboard();
}catch(e){
alert(errText(e));
await signOut(auth);
}
});

function showShell(label){
$('landing').style.display='none';
$('app').classList.add('show');
$('userLine').textContent=label;
}

function showDashboard(){
showShell((profile.nama||profile.email)+' · '+(profile.role==='admin'?'Admin':'Guru'));
if(profile.role==='admin')adminDashboard();
else teacherDashboard();
}

window.logout=async()=>{
if(auth.currentUser)await signOut(auth);
profile=null;student=null;
$('app').classList.remove('show');
$('landing').style.display='block';
};

function genCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}

async function createClass(e){
e.preventDefault();
try{
const all=await getDocs(collection(db,'classes'));
let kode=genCode();
while(all.docs.some(d=>d.data().kode===kode)){kode=genCode();}
await addDoc(collection(db,'classes'),{
nama:$('cname').value.trim(),
deskripsi:$('cdesc').value.trim(),
kode,
ownerUid:profile.uid,
ownerEmail:profile.email,
createdAt:serverTimestamp()
});
$('cmsg').textContent='Kelas berhasil dibuat. Kode: '+kode;
$('cmsg').classList.add('ok');
$('classForm').reset();
await loadClasses();
}catch(e){$('cmsg').textContent=errText(e);}
}

async function loadClasses(){
const s=await getDocs(query(collection(db,'classes'),where('ownerUid','==',profile.uid)));
$('myClasses').innerHTML=s.size?s.docs.map(d=>item(d.data().nama,`
<p class="muted">${esc(d.data().deskripsi||'')}</p>
<div class="code">${esc(d.data().kode)}</div>
<p class="muted">Bagikan kode ini kepada murid.</p>
<div class="actions">
<button type="button" class="small-btn" onclick="copyCode('${esc(d.data().kode)}')">Salin kode</button>
<button type="button" class="danger" onclick="teacherDeleteClass('${d.id}')">Hapus kelas</button>
</div>
`)).join(''):'<div class="empty">Kamu belum membuat kelas.</div>';
}

window.copyCode=async c=>{
try{await navigator.clipboard.writeText(c);alert('Kode kelas disalin: '+c);}catch{prompt('Salin kode kelas:',c);}
};

window.teacherDeleteClass=async id=>{
if(!confirm('Hapus kelas ini?'))return;
try{await deleteDoc(doc(db,'classes',id));await loadClasses();}catch(e){alert(errText(e));}
};

window.cekLatihanLengkap=()=>{
let lengkap=true;
latihanData.pg.forEach((_,i)=>{
if(!document.querySelector(`input[name="lat${i}"]:checked`)) lengkap=false;
});
const btn=$('latihanCheck');
if(btn) btn.disabled=!lengkap;
};

window.periksaLatihan=()=>{
let benar=0;
const details=[];
latihanData.pg.forEach((x,i)=>{
const chosen=document.querySelector(`input[name="lat${i}"]:checked`);

function getPredikat(nilai){
if(nilai>=90) return {label:'A',kelas:'a'};
if(nilai>=80) return {label:'B',kelas:'b'};
if(nilai>=70) return {label:'C',kelas:'c'};
if(nilai>=60) return {label:'D',kelas:'d'};
return {label:'E',kelas:'e'};
}

function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

}else if(s.jenis==='match'){

if(s.pasangan.some((p,pi)=>!jm[pi])) ok=false;
}else if(s.jenis==='drag'){
if(!kuisState.jawaban.drag[s.idx]) ok=false;
}

if(!ok){
alert('Lengkapi jawaban soal ini dulu ya.');
return;
}

if(kuisState.index===kuisState.soal.length-1){
const semuaLengkap=kuisState.soal.every(so=>{

if(so.jenis==='match'){
const jm=kuisState.jawaban.match[so.idx]||{};
return so.pasangan.every((p,pi)=>!!jm[pi]);
}
if(so.jenis==='drag') return !!kuisState.jawaban.drag[so.idx];
});

}

$('content').innerHTML=`
<section class="panel">
<h2>📊 Monitoring Kuis</h2>
<p class="muted">Pantau progres kuis murid di kelasmu dan beri feedback.</p>
<div id="kelasSelectWrap"></div>
<div id="monitorContent"></div>
</section>`;
try{
const s=await getDocs(query(collection(db,'classes'),where('ownerUid','==',profile.uid)));
if(!s.size){
$('kelasSelectWrap').innerHTML='<div class="empty">Kamu belum punya kelas.</div>';
return;
}
const kelas=s.docs.map(d=>({id:d.id,...d.data()}));
$('kelasSelectWrap').innerHTML=`
<label style="display:block;font-weight:800;font-size:13px;margin-bottom:8px">Pilih kelas:</label>
<select id="pilihKelasMonitor" style="width:100%;padding:11px;border:2px solid #e6def4;border-radius:10px;font-family:Nunito,sans-serif;font-size:14px;background:white;color:#35256c;margin-bottom:10px">
${kelas.map(k=>`<option value="${k.id}">${esc(k.nama)} (${esc(k.kode)})</option>`).join('')}
</select>`;
$('pilihKelasMonitor').addEventListener('change',()=>{loadMonitorKelas($('pilihKelasMonitor').value);});
await loadMonitorKelas(kelas[0].id);
}catch(e){
$('monitorContent').innerHTML=`<div class="empty">${esc(errText(e))}</div>`;
}
}
window.renderMonitoringGuru=renderMonitoringGuru;

async function loadMonitorKelas(classId){
const el=$('monitorContent');
el.innerHTML='<div class="empty">Memuat progres murid...</div>';
try{
const progresSnap=await getDocs(query(collection(db,'progres_soal'),where('classId','==',classId)));
const progres=progresSnap.docs.map(d=>({id:d.id,...d.data()}));
const feedbackSnap=await getDocs(query(collection(db,'feedback_soal'),where('classId','==',classId)));
const feedbackMap={};
feedbackSnap.docs.forEach(d=>{
const x=d.data();
feedbackMap[`${x.studentKode}_${x.studentNama}`]=x;
});
const total=progres.length;
const selesai=progres.filter(p=>p.selesaiKuis).length;
const sudahFeedback=Object.keys(feedbackMap).length;
const belumFeedback=total-sudahFeedback;

let ringkasan=`<div class="summary-box">
<h4>📊 Ringkasan Kelas</h4>
<p>${total} murid · <span class="good">${selesai} selesai kuis</span> · ${total-selesai} belum</p>
<p>📝 Feedback terkirim: <strong>${sudahFeedback}</strong> · belum: <strong>${belumFeedback}</strong></p>
</div>`;

if(!progres.length){
el.innerHTML=ringkasan+'<div class="empty">Belum ada murid yang mengerjakan kuis.</div>';
return;
}

let rows=progres.map(p=>{
const skor=p.skorTotal||0;
const fb=feedbackMap[`${p.studentKode}_${p.studentNama}`];
const nama=p.studentNama||'-';
const kode=p.studentKode||'-';
const statusClass=p.selesaiKuis?'done':'pending';
const statusText=p.selesaiKuis?'✅ Selesai':'⏳ Belum';
const skorClass=skor<60?'low':'';
return `<tr>
<td><input type="checkbox" class="cb-murid" data-nama="${esc(nama)}" data-kode="${esc(kode)}"></td>
<td style="cursor:pointer" class="nama-murid" data-nama="${esc(nama)}" data-kode="${esc(kode)}"><strong>${esc(nama)}</strong><br><span style="font-size:11px;color:#8984a5">${esc(kode)}</span></td>
<td class="score ${skorClass}">${Math.round(skor)}/100</td>
<td class="${statusClass}">${statusText}</td>
<td>${p.skorUraian!==undefined && p.skorUraian!==null && p.skorUraian>0 ? Math.round(p.skorUraian)+'/60' : '—'}</td>
<td>${fb?'✅ Sudah':'—'}</td>
<td><button class="btn-feedback" data-nama="${esc(nama)}" data-kode="${esc(kode)}">${fb?'Edit':'Beri'}</button></td>
</tr>`;
}).join('');

el.innerHTML=ringkasan+`
<div class="bulk-bar">
<strong>Feedback massal:</strong>
<span style="color:#8984a5">Centang beberapa murid, lalu pilih template:</span>
<button onclick="feedbackMassal('pujian')">🎉 Pujian</button>
<button onclick="feedbackMassal('motivasi')">💪 Motivasi</button>
<button onclick="feedbackMassal('saran')">📚 Saran</button>
<button onclick="feedbackMassal('perbaikan')">⚠️ Perbaikan</button>
</div>
<div style="overflow-x:auto">
<table class="monitor-table">
<thead><tr><th></th><th>Nama</th><th>Skor</th><th>Status</th><th>Uraian</th><th>Feedback</th><th>Aksi</th></tr></thead>
<tbody>${rows}</tbody>
</table>
</div>`;

el.querySelectorAll('.btn-feedback').forEach(btn=>{
btn.addEventListener('click',(e)=>{e.stopPropagation();bukaFormFeedback(btn.dataset.nama,btn.dataset.kode,classId,progres);});
});

el.querySelectorAll('.nama-murid').forEach(td=>{
td.addEventListener('click',()=>{
const p=progres.find(x=>x.studentNama===td.dataset.nama && x.studentKode===td.dataset.kode);
if(p) bukaDetailKuis(p);
});
});

}catch(e){
el.innerHTML=`<div class="empty">${esc(errText(e))}</div>`;
}
}

async function bukaDetailKuis(p){
const nama=p.studentNama||'-';
const kode=p.studentKode||'-';

let riwayat=[];
try{
const rs=await getDocs(query(collection(db,'riwayat_soal'),where('studentNama','==',nama),where('studentKode','==',kode)));
riwayat=rs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
const ta=a.at?.toDate?a.at.toDate().getTime():0;
const tb=b.at?.toDate?b.at.toDate().getTime():0;
return tb-ta;
});
}catch(e){}

const jawaban=p.jawabanKuis||{};

const uraianHTML=kuisData.uraian.map((u,i)=>{
const ans=jawaban.uraian && jawaban.uraian[i] ? esc(jawaban.uraian[i]) : '(belum dijawab)';
const skorGuru=p.skorUraianPerSoal && p.skorUraianPerSoal[i]!==undefined ? `<br><em style="color:#8056d9">Skor guru: ${p.skorUraianPerSoal[i]}/12</em>` : '';
return `<div class="detail-item empty"><strong>Uraian ${i+1}:</strong> ${ans}${skorGuru}</div>`;
}).join('');

const matchHTML=kuisData.match.map((m,mi)=>{
let inner='';
m.pasangan.forEach((p,pi)=>{
const ans=(jawaban.match&&jawaban.match[mi])?jawaban.match[mi][pi]:'';
const ok=ans===p.answer;
const cls=!ans?'empty':(ok?'correct':'wrong');
inner+=`<div class="detail-item ${cls}"><strong>${esc(p.term)}:</strong> ${esc(ans||'(kosong)')} ${ans?(ok?'✓':`✗ (benar: ${esc(p.answer)})`):''}</div>`;
});
return `<div style="background:#f8f2ff;border-radius:12px;padding:10px;margin-bottom:8px"><p style="font-size:11px;color:#6845ae;margin-bottom:6px">${esc(m.konteks)}</p>${inner}</div>`;
}).join('');

const dragHTML=kuisData.drag.map((d,i)=>{
const ans=jawaban.drag && jawaban.drag[i] ? jawaban.drag[i] : '';
const ok=ans===d.answer;
const cls=!ans?'empty':(ok?'correct':'wrong');
return `<div class="detail-item ${cls}"><strong>Drag ${i+1}:</strong> ${esc(ans||'(kosong)')} ${ans?(ok?'✓':`✗ (benar: ${esc(d.answer)})`):''}</div>`;
}).join('');

const riwayatHTML=riwayat.length
? riwayat.map((r,i)=>`
<div class="riwayat-item">
<div class="riwayat-head">
<strong>Percobaan ${riwayat.length-i}</strong>
<span>${r.at?.toDate?r.at.toDate().toLocaleString('id-ID'):''}</span>
</div>
<div class="riwayat-score">Skor: ${Math.round(r.skor||0)}/100</div>
<p style="font-size:12px;margin-top:6px">Match: ${Math.round(r.skorMatch||0)}/20 · Drag: ${Math.round(r.skorDrag||0)}/20 · Uraian: ${r.skorUraian!==undefined && r.skorUraian!==null && r.skorUraian>0 ? Math.round(r.skorUraian)+'/60' : 'menunggu'}</p>
</div>`).join('')
: '<div class="empty">Belum ada riwayat percobaan.</div>';

const modal=document.createElement('div');
modal.className='modal show';
modal.innerHTML=`
<div class="modal-card" style="max-width:640px">
<h2>${esc(nama)} — ${esc(kode)}</h2>
<div class="tabs" style="margin-bottom:12px">
<button class="tab-btn active" data-tab="jawaban">📝 Jawaban Terakhir</button>
<button class="tab-btn" data-tab="riwayat">📜 Riwayat (${riwayat.length})</button>
<button class="tab-btn" data-tab="nilai">✍️ Nilai Uraian</button>
</div>

<div data-tab-content="jawaban">
<div class="detail-section"><h4>🔗 Menjodohkan</h4>${matchHTML}</div>
<div class="detail-section"><h4>🧩 Drag</h4>${dragHTML}</div>
<div class="detail-section"><h4>✍️ Uraian</h4>${uraianHTML}</div>
</div>

<div data-tab-content="riwayat" style="display:none">
${riwayatHTML}
</div>

<div data-tab-content="nilai" style="display:none">
<h4 style="margin-bottom:10px;color:#6845ae">Beri nilai uraian (0–12 per soal, total maks 60)</h4>
${kuisData.uraian.map((u,i)=>`
<div style="margin-bottom:12px">
<strong style="font-size:13px">Uraian ${i+1}:</strong>
<p style="font-size:12px;color:#8984a5;margin:4px 0">${esc(jawaban.uraian && jawaban.uraian[i] ? jawaban.uraian[i] : '(kosong)')}</p>
<input type="number" class="skor-uraian" data-i="${i}" min="0" max="12" step="1" value="${p.skorUraianPerSoal && p.skorUraianPerSoal[i]!==undefined ? p.skorUraianPerSoal[i] : 0}" style="width:100px;padding:8px;border:2px solid #e6def4;border-radius:8px;font-family:Nunito,sans-serif">
</div>`).join('')}
<button class="submit" id="simpanNilai" style="margin-top:10px">Simpan Nilai Uraian</button>
<p class="message" id="msgNilai"></p>
</div>

<div style="display:flex;justify-content:flex-end;margin-top:14px">
<button class="secondary" id="closeDetail" style="padding:10px 20px">Tutup</button>
</div>
</div>`;
document.body.appendChild(modal);

modal.querySelectorAll('.tab-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
modal.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
modal.querySelectorAll('[data-tab-content]').forEach(c=>{
c.style.display=c.dataset.tabContent===btn.dataset.tab?'block':'none';
});
});
});

modal.querySelector('#closeDetail').addEventListener('click',()=>modal.remove());
modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});

modal.querySelector('#simpanNilai').addEventListener('click',async()=>{
const inputs=modal.querySelectorAll('.skor-uraian');
const perSoal={};
let total=0;
inputs.forEach(inp=>{
const i=Number(inp.dataset.i);
const v=Math.max(0,Math.min(12,Number(inp.value)||0));
perSoal[i]=v;
total+=v;
});
const skorMatch=p.skorMatch||0;
const skorDrag=p.skorDrag||0;
const skorUraian=total;
const skorTotal=skorMatch+skorDrag+skorUraian;
try{
await updateDoc(doc(db,'progres_soal',p.id),{
skorUraian,skorUraianPerSoal:perSoal,skorTotal,updatedAt:serverTimestamp()
});
modal.querySelector('#msgNilai').textContent='Nilai uraian tersimpan. Skor total: '+Math.round(skorTotal)+'/100';
modal.querySelector('#msgNilai').classList.add('ok');
await loadMonitorKelas(p.classId);
}catch(e){
modal.querySelector('#msgNilai').textContent=errText(e);
}
});
}

async function bukaFormFeedback(nama,kode,classId,progresList){
const p=progresList.find(x=>x.studentNama===nama&&x.studentKode===kode);
if(!p)return;
const got=p.skorTotal||0;

const fbs=await getDocs(query(collection(db,'feedback_soal'),where('studentNama','==',nama),where('studentKode','==',kode)));
const oldText=fbs.size?fbs.docs[0].data().feedback:'';
const oldId=fbs.size?fbs.docs[0].id:null;

const modal=document.createElement('div');
modal.className='modal show';
modal.innerHTML=`
<div class="modal-card" style="max-width:560px">
<h2>Feedback untuk ${esc(nama)}</h2>
<p style="font-size:13px;color:#8984a5;margin-bottom:14px">Kode: ${esc(kode)} · Skor: ${Math.round(got)}/100</p>
<div class="template-btns">
<button data-tpl="pujian">🎉 Pujian</button>
<button data-tpl="motivasi">💪 Motivasi</button>
<button data-tpl="saran">📚 Saran</button>
<button data-tpl="perbaikan">⚠️ Perbaikan</button>
</div>
<textarea id="fbText" style="width:100%;min-height:110px;padding:12px;border:2px solid #e6def4;border-radius:12px;font-family:Nunito,sans-serif;font-size:14px;resize:vertical" placeholder="Tulis feedback...">${esc(oldText)}</textarea>
<div style="display:flex;gap:10px;margin-top:14px">
<button class="submit" id="fbSave" style="flex:1">Simpan Feedback</button>
<button class="secondary" id="fbClose" style="flex:0 0 auto;padding:11px 20px">Batal</button>
</div>
<p class="message" id="fbMsg"></p>
</div>`;
document.body.appendChild(modal);

modal.querySelector('#fbClose').addEventListener('click',()=>modal.remove());
modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});

modal.querySelectorAll('.template-btns button').forEach(b=>{
b.addEventListener('click',()=>{
modal.querySelector('#fbText').value=TEMPLATE_FB[b.dataset.tpl].replace('[nama]',nama);
});
});

modal.querySelector('#fbSave').addEventListener('click',async()=>{
const text=modal.querySelector('#fbText').value.trim();
if(!text){modal.querySelector('#fbMsg').textContent='Feedback tidak boleh kosong.';return;}
try{
modal.querySelector('#fbSave').disabled=true;
if(oldId){
await updateDoc(doc(db,'feedback_soal',oldId),{feedback:text,createdAt:serverTimestamp()});
}else{
await addDoc(collection(db,'feedback_soal'),{
studentNama:nama,
studentKode:kode,
classId,
classOwnerUid:profile.uid,
feedback:text,
createdAt:serverTimestamp()
});
}
modal.remove();
await loadMonitorKelas(classId);
}catch(e){
modal.querySelector('#fbMsg').textContent=errText(e);
modal.querySelector('#fbSave').disabled=false;
}
});
}

window.feedbackMassal=async function(tpl){
const checked=[...document.querySelectorAll('.cb-murid:checked')];
if(!checked.length){alert('Centang minimal 1 murid.');return;}
const text=prompt('Template feedback (bisa diedit):',TEMPLATE_FB[tpl]);
if(!text)return;
const classId=$('pilihKelasMonitor').value;
let ok=0;
for(const cb of checked){
const nama=cb.dataset.nama;
const kode=cb.dataset.kode;
try{
const fbs=await getDocs(query(collection(db,'feedback_soal'),where('studentNama','==',nama),where('studentKode','==',kode)));
const personal=text.replace('[nama]',nama);
if(fbs.size){
await updateDoc(doc(db,'feedback_soal',fbs.docs[0].id),{feedback:personal,createdAt:serverTimestamp()});
}else{
await addDoc(collection(db,'feedback_soal'),{
studentNama:nama,studentKode:kode,classId,
classOwnerUid:profile.uid,feedback:personal,createdAt:serverTimestamp()
});
}
ok++;
}catch(e){console.error(e);}
}
alert(`Feedback terkirim ke ${ok} murid.`);
await loadMonitorKelas(classId);
};

</script>
</body>
</html>
